name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          set -o pipefail
          npx wrangler pages deploy dist --project-name=makautstudyzone --account-id="$CLOUDFLARE_ACCOUNT_ID" --commit-dirty=true 2>&1 | tee wrangler_log.txt || {
            cat wrangler_log.txt | while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::error title=Wrangler::$line"
              fi
            done
            exit 1
          }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
